name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Verify version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if("v"+p.version!==process.env.TAG)process.exit(1)'
      - name: Package installable bundle
        run: |
          mkdir release-package
          cp dist/ha-sidebar-colors.js hacs.json LICENSE release-package/
          cp README.md release-package/
          cp -r docs release-package/
          (cd release-package && zip -qr ../ha-sidebar-colors-${{ github.ref_name }}.zip .)
          sha256sum dist/ha-sidebar-colors.js ha-sidebar-colors-${{ github.ref_name }}.zip > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --title "Sidebar Colors ${{ github.ref_name }}" --notes-file CHANGELOG.md dist/ha-sidebar-colors.js ha-sidebar-colors-${{ github.ref_name }}.zip SHA256SUMS.txt
